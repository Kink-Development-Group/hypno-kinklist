name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '44 9 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: 'This issue has had no activity for 60 days and will be closed in 14 days unless there is new activity.'
          stale-pr-message: 'This pull request has had no activity for 60 days and will be closed in 14 days unless there is new activity.'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security'
